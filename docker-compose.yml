services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: antes
      POSTGRES_PASSWORD: antes
      POSTGRES_DB: antes
    ports:
      - "55432:5432"
    volumes:
      - antes_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antes -d antes"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  antes_pg:
